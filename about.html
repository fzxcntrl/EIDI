<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#021a12">
  <title>About 🌙</title>

  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Animated Background -->
  <div id="particles" class="particles"></div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <main class="app-container">

    <section class="section-container">

      <div class="glass-card text-center about-card">

        <div class="mosque-icon">🕌</div>

        <h2 class="text-gold">Eid Mubarak</h2>

        <blockquote class="hadith-quote">
          “Tahaabu, tahaabbu”  
          <span>(Give gifts to one another, you will love each other) – <strong>Al-Adab Al-Mufrad</strong></span>
        </blockquote>

        <p class="text-light">
          Thank you for celebrating with me. Your kindness makes this Eid special.
        </p>

        <div class="supporter-card">
          <h4>Total Supporters</h4>
          <div class="counter-wrapper">
            <i class='bx bxs-user-plus'></i>
            <span id="counter">0</span>
          </div>
        </div>

      </div>

      <div class="text-center share-section">
        <h3>Challenge 3 friends to send Eidi 😄</h3>

        <div class="share-buttons">
          <a id="shareWaBtn" class="btn btn-icon whatsapp-btn">
            <i class='bx bxl-whatsapp'></i>
          </a>

          <button id="shareCopyBtn" class="btn btn-icon btn-glass">
            <i class='bx bx-link-alt'></i>
          </button>
        </div>
      </div>

    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class='bx bxs-home-heart'></i>
      <span>Home</span>
    </a>
    <a href="eidi-wall.html" class="nav-item">
      <i class='bx bxs-party'></i>
      <span>Wall</span>
    </a>
    <a href="about.html" class="nav-item active">
      <i class='bx bxs-info-circle'></i>
      <span>About</span>
    </a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
