<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eidi Collection 🌙</title>
    <!-- Google Fonts for Islamic aesthetic -->
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="light-mode">

    <!-- Eid Mubarak Popup Modal -->
    <div id="eidModal" class="modal-overlay">
        <div class="modal-content glass-effect">
            <h2 class="arabic-font text-gold">🌙 Eid Mubarak!</h2>
            <p>May Allah bless you with happiness and success!</p>
            <button id="closeModalBtn" class="btn primary-btn mt-1">Thank You</button>
        </div>
    </div>

    <!-- Sticky Navigation -->
    <nav class="navbar">
        <div class="logo font-bold text-gold arabic-font">Eidi</div>
        <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle Theme">🌙</button>
    </nav>

    <!-- Background Animated Moon -->
    <div class="floating-moon">🌙</div>

    <!-- Main Content -->
    <main class="container text-center pb-2">
        <section class="hero scroll-reveal mt-2">
            <!-- Profile Image -->
            <div class="profile-container animate-glow">
                <img src="images/profile.jpg" alt="My Profile" id="userProfileImg" class="profile-img">
            </div>
            🫶🏼
            <h1 class="arabic-font text-gold mt-1 animated-text">Send Farzain Naikwade's Eidi 🫶🏼 </h1>
            <p class="subtitle mt-1">Spread love and blessings this beautiful day.</p>

            <!-- Action Buttons Container -->
            <div class="action-buttons mt-2">
                
                <!-- Primary Actions (Full width, prominent) -->
                <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;">
                    <a href="https://rzp.io/rzp/Aom9Xum" class="btn action-btn btn-sunnah btn-primary-cta ripple">
                        👉 Send Eidi Through Upi💸
                    </a>
                    <button id="viewQrBtn" class="btn action-btn btn-qr btn-primary-cta ripple">
                        👉 View QR Code For Eidi
                    </button>
                </div>

                <!-- Secondary Actions (Grid) -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <a href="blessings.html" class="btn action-btn btn-card ripple">
                        💌 Open Digital Eid Card
                    </a>
                    <a href="wishes.html" class="btn action-btn btn-sunnah ripple">
                        🕌 Eid Reflections & Sunnah
                    </a>
                </div>
            </div>
        </section>

        <!-- QR Code Section (Hidden by default, scrolls/opens on click) -->
        <section id="qrSection" class="qr-section glass-effect mt-2 hidden scroll-reveal">
            <h3 class="arabic-font text-gold mb-1">Scan to Send Eidi</h3>
            <div class="qr-container bg-white">
                <img src="images/qr.PNG" alt="My QR Code" class="qr-img" id="qrImageElement">
            </div>
            <div class="qr-actions mt-1">
                <a href="images/qr.PNG" download="My_UPI_QR.png" class="btn outline-btn ripple flex-1">📥 Download
                    QR</a>
                <button id="fullscreenQrBtn" class="btn outline-btn ripple flex-1">🔲 Fullscreen</button>
            </div>
            <button id="copyUpiBtn" class="btn outline-btn ripple w-full mt-1">📋 Copy UPI ID</button>
        </section>

        <!-- Share Section -->
        <section class="share-section mt-2 scroll-reveal text-center">
            <button id="shareLinkBtn" class="btn outline-btn ripple w-full mb-1"
                style="padding: 0.6rem; font-size: 0.8rem;">🔗 Copy. Share. Make Others Send
                Farzain Ki Eidi.</button>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast">Link copied!</div>

    <!-- Fullscreen QR Modal -->
    <div id="fullscreenQrModal" class="modal-overlay hidden">
        <div class="fullscreen-qr-container">
            <button id="closeFullscreenBtn" class="close-icon text-gold">✖</button>
            <img src="images/qr.PNG" alt="QR Code Fullscreen" class="qr-img-fullscreen">
        </div>
    </div>

    <!-- Scripts -->
    <!-- Confetti standard JS library for simple particle effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
