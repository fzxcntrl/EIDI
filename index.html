<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#021a12">
  <title>Eidi Collection 🌙</title>

  <!-- SEO -->
  <meta name="description" content="Send your Eidi with love this festive season 💚">
  <meta property="og:title" content="Eidi Collection 🌙">
  <meta property="og:description" content="Click here to easily send Eidi via UPI.">

  <link rel="manifest" href="manifest.json">

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Loader -->
  <div id="loader" class="loader-overlay">
    <div class="crescent-loader">🌙</div>
  </div>

  <!-- Animated Background -->
  <div id="particles" class="particles"></div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Music Toggle -->
  <button id="musicToggle" class="music-toggle">
    <i class='bx bx-volume-mute'></i>
  </button>

  <!-- Welcome Modal -->
  <div id="welcomeModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-icon">🌙</div>
      <h2 class="text-gold">Eid Mubarak!</h2>
      <p class="text-muted">
        May Allah bless you with happiness and prosperity.
        Send your Eidi with love 💚
      </p>
      <button id="continueBtn" class="btn btn-primary w-full">
        Continue ✨
      </button>
    </div>
  </div>

  <main class="app-container">

    <!-- HERO -->
    <section class="section-container text-center hero-section">

      <img src="images/lantern.png" alt="Lantern" class="lantern lantern-left">
      <img src="images/lantern.png" alt="Lantern" class="lantern lantern-right">

      <div class="profile-img-container">
        <img id="profileImage" src="images/profile.jpg" alt="Profile" class="profile-img">
      </div>

      <h1 id="profileName" class="hero-title"></h1>
      <p id="profileMessage" class="text-muted hero-message"></p>

      <button id="sendEidiTopBtn" class="btn btn-primary">
        Send Eidi Now 💚
      </button>

    </section>

    <!-- PAYMENT -->
    <section id="qrSection" class="section-container">

      <div class="glass-card text-center">

        <h3 class="text-gold">Scan & Pay Securely</h3>

        <div class="qr-wrapper">
          <img id="qrImage" src="images/qr.png" alt="UPI QR Code" class="qr-image">
        </div>

        <div class="upi-info">
          <span>UPI ID:</span>
          <strong id="upiIdText"></strong>
          <button id="copyUpiBtn" class="btn btn-icon btn-glass">
            <i class='bx bx-copy'></i>
          </button>
        </div>

        <div class="payment-controls">

          <label>Your Name (Optional)</label>
          <input type="text" id="senderName" class="input-field" placeholder="Enter your name">

          <label>Select Amount</label>

          <div class="amount-pills">
            <button class="pill" data-amount="51">₹51</button>
            <button class="pill active" data-amount="101">₹101</button>
            <button class="pill" data-amount="501">₹501</button>
            <button class="pill" data-amount="custom">Custom</button>
          </div>

          <input type="number" id="customAmount" class="input-field" placeholder="Enter amount" min="1">

          <button id="payBtn" class="btn btn-primary w-full">
            Pay ₹101 via UPI
          </button>

        </div>

      </div>

    </section>

  </main>

  <!-- NAVIGATION -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <i class='bx bxs-home-heart'></i>
      <span>Home</span>
    </a>
    <a href="eidi-wall.html" class="nav-item">
      <i class='bx bxs-party'></i>
      <span>Wall</span>
    </a>
    <a href="about.html" class="nav-item">
      <i class='bx bxs-info-circle'></i>
      <span>About</span>
    </a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
