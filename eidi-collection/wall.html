<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eidi Wall | Spread Love</title>
    <link rel="stylesheet" href="css/styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="light-mode wall-bg">

    <header class="app-header">
        <a href="index.html" class="icon-toggle no-underline">🔙</a>
    </header>

    <main class="container">
        <section class="text-center pt-3 pb-3">
            <h1 class="arabic-font gold-text">The Eidi Wall</h1>
            <p class="subtitle text-ivory">Messages from generous souls</p>
        </section>

        <section id="wall-container" class="wall-grid pb-5">
            <!-- Cards injected via JS -->
        </section>

        <!-- Empty State (Hidden initially) -->
        <div id="empty-wall" class="text-center glass mt-4 p-4 hidden">
            <h3 class="arabic-font gold-text mb-2">Such empty...</h3>
            <p>Be the first to send Eidi and bless this wall!</p>
            <a href="index.html#payment-section" class="btn primary-btn mt-3 inline-block">Send Eidi</a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/wall.js"></script>
</body>

</html>
