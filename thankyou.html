<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JazakAllah Khair 🤲</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .thankyou-wrapper {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        .thankyou-heading {
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-out;
        }

        .thankyou-heading:not(.hidden) {
            opacity: 1;
            transform: translateY(0);
        }

        .thankyou-dua {
            font-size: 1.25rem;
            color: var(--text-color);
            margin-bottom: 2.5rem;
            max-width: 400px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-out;
            transition-delay: 0.2s;
        }

        .thankyou-dua:not(.hidden) {
            opacity: 1;
            transform: translateY(0);
        }

        .sparkle {
            position: absolute;
            font-size: 1.5rem;
            animation: floatMoon 4s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        .s1 { top: 20%; left: 15%; animation-delay: 0s; }
        .s2 { top: 15%; right: 20%; animation-delay: 1s; }
        .s3 { bottom: 30%; left: 25%; animation-delay: 2s; }
        .s4 { bottom: 25%; right: 15%; animation-delay: 1.5s; }
    </style>
</head>

<body class="light-mode" id="thankYouAnimationContainer">

    <!-- Sticky Navigation -->
    <nav class="navbar">
        <a href="index.html" class="back-link font-bold text-gold">🔙 Home</a>
        <div class="logo font-bold text-gold arabic-font">Thank You</div>
        <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle Theme">🌙</button>
    </nav>

    <!-- Background Pattern & Elements -->
    <div class="floating-moon">🌙</div>
    <div class="sparkle s1">✨</div>
    <div class="sparkle s2">✨</div>
    <div class="sparkle s3">🌟</div>
    <div class="sparkle s4">✨</div>

    <!-- Main Content -->
    <main class="container">
        <div class="thankyou-wrapper glass-effect">
            <h1 id="jazakallahText" class="arabic-font thankyou-heading hidden">JazakAllah Khair 🤲</h1>
            <p id="duaText" class="thankyou-dua hidden">May Allah reward you for your generosity and accept your Eidi.</p>
            
            <a href="index.html" class="btn outline-btn ripple mt-2">
                🏠 Return Home
            </a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
